name: Build FTS15 Mod with Dobby

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Descargar Dobby (Código Fuente)
        run: |
          cd fts15_mod
          git clone --depth=1 https://github.com/jmpews/Dobby.git dobby_src
          mkdir -p dobby/include
          cp -r dobby_src/include/* dobby/include/

      - name: Asegurar CMakeLists.txt con Dobby
        run: |
          cd fts15_mod
          cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.10)
          project(ftsmod CXX)
          set(CMAKE_CXX_STANDARD 17)

          # Agregar la ruta base global para que Dobby encuentre sus propios headers internos (core/arch/Cpu.h)
          include_directories(
              dobby_src/source
              dobby/include
          )

          # Integrar Dobby directamente
          add_subdirectory(dobby_src)

          # Compilar el mod principal
          add_library(ftsmod SHARED mod.cpp)

          # Vincular librerías
          target_link_libraries(ftsmod dobby log dl)
          EOF

      - name: Compilar con CMake y NDK
        run: |
          cd fts15_mod
          mkdir -p build
          
          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Usando NDK en: $NDK_PATH"
          
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Subir Artifact (.so compilado)
        uses: actions/upload-artifact@v4
        with:
          name: libftsmod-armeabi-v7a
          path: fts15_mod/build/libftsmod.so
