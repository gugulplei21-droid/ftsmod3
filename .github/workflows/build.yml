name: Build ftsmod (Dobby)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a, x86_64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # por si dobby_src es submódulo

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: true
          link-to-sdk: true

      - name: Configurar CMake
        run: |
          cmake -S fts15_mod -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build-${{ matrix.abi }} --parallel $(nproc)

      - name: Verificar símbolos
        run: |
          find build-${{ matrix.abi }} -name "libftsmod.so" -exec \
            $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D {} \;

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libftsmod-${{ matrix.abi }}
          path: build-${{ matrix.abi }}/**/libftsmod.so
          if-no-files-found: error
