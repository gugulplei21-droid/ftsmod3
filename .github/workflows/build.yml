name: Build FTS15 Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Library (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Descargar Dobby automaticamente
        run: |
          cd fts15_mod
          mkdir -p dobby/include dobby/lib/armeabi-v7a
          
          # Descargamos los headers oficiales de Dobby
          curl -L -o dobby_master.zip https://github.com/jmpews/Dobby/archive/refs/heads/master.zip
          unzip -q dobby_master.zip
          cp -r Dobby-master/include/* dobby/include/
          
          # Descargamos el release precompilado de Dobby
          curl -L -o dobby_android.zip https://github.com/jmpews/Dobby/releases/download/2.3/Dobby-Android.zip || true
          if [ -f dobby_android.zip ]; then
            unzip -q dobby_android.zip || true
          fi
          
          # Limpieza de temporales
          rm -rf dobby_master.zip Dobby-master dobby_android.zip

      - name: Compilar con CMake y NDK (Línea de comandos pura)
        run: |
          cd fts15_mod
          mkdir -p build
          
          # El SDK y NDK de Android ya vienen preinstalados en los runners de GitHub (`$ANDROID_SDK_ROOT`)
          export NDK_PATH=$ANDROID_SDK_ROOT/ndk/current
          
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Subir Artifact (.so compilado)
        uses: actions/upload-artifact@v4
        with:
          name: libftsmod-armeabi-v7a
          path: fts15_mod/build/libftsmod.so
